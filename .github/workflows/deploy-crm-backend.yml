name: Deploy CRM backend
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference (from your project settings)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: crm-backend-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run check:backend
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Validate project reference
        run: '[[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]'
      - name: Link the existing project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push --yes
      - name: Deploy CRM actions
        run: supabase functions deploy crm-action --project-ref "$PROJECT_REF"
      - name: Deploy automation executor
        run: supabase functions deploy crm-automation --project-ref "$PROJECT_REF"
      - name: Deploy scheduled mailbox sending
        run: supabase functions deploy mail-send --project-ref "$PROJECT_REF"
